global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: credit_risk_api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ['postgres:5432']

  - job_name: airflow
    static_configs:
      - targets: ['airflow-webserver:8080']
    metrics_path: /metrics
